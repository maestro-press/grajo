name: Tests

# The CI floor (arc item A1, 2026-07-18): full suite + repo gates + audit on
# every PR and every push to main — deliberately NO path filters, so a check
# context always exists (path-filtered workflows were why "no check runs" used
# to read as normal here).
#
# ⚠ Job KEYS (suite / static-checks / audit) are load-bearing: branch
# protection requires them as status-check contexts, and GitHub uses the job
# key as the context because these jobs must NOT set a `name:` property.
# Renaming a key requires updating branch protection in the same PR.
#
# CI green does NOT cover schema migrations — SCHEMA_GENERATION bumps still
# require the manual migration rail (scripts/schema-migration-dryrun.sh) on
# live-shaped data before merge.
#
# Gitea Actions names them "<job> (pull_request)": suite (pull_request), static-checks (pull_request), audit (pull_request).

on:
  pull_request:
  push:
    branches: [main]

# Never cancel a main verification run (two quick merges must both get
# verified); superseded PR pushes are safe to cancel.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    # 45 (was 30; PT-2b added ~10 min of two-gateway sync tests), not 15: on 2026-10-26 the runner's apt mirror and the playwright CDN
    # were slow enough (~9.5 min browser + deps, ~5.5 min apt-get update) that
    # setup alone used the whole 15 minutes and every suite was cancelled
    # before a test ran. The cache below takes the browser download off the
    # path; the margin covers a slow mirror.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # registry/addon-past-defaults reads git history; a shallow clone skips it
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # S3 (M7): the pi sandbox tests (tests/pi-sandbox.test.js) need
      # bubblewrap and unprivileged user namespaces. ubuntu-24.04 runners
      # restrict those through AppArmor, so lift that for this throwaway VM.
      # Best effort: if it still cannot work, the sandbox tests self-skip and
      # every other PiRpc test runs unwrapped, exactly as before.
      - name: Enable the pi sandbox (bubblewrap + unprivileged userns)
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq bubblewrap || { sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap; }
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if bwrap --dev-bind / / --unshare-user -- /bin/true; then
            echo "pi sandbox available: sandbox tests will run"
          else
            echo "::warning::pi sandbox unavailable on this runner; tests/pi-sandbox.test.js integration cases will skip"
          fi
      # Live layout tests (phone-width checks, Perch @412x730 …) drive a private
      # headless Chrome (tests/fixtures/headless-chrome.mjs), found under
      # ~/.cache/ms-playwright. The live BROWSER tests run the Chromium that the
      # browser bundle's LOCKED playwright ships (bundles/browser) — the product
      # image does `npx playwright install chromium` from that same lock — so the
      # download is provisioned by the bundle's own CLI below and the cache is
      # keyed by bundles/browser/package-lock.json. The exact playwright and
      # Chromium versions are never hard-coded here: the "Headless Chrome for the
      # live layout tests" step prints them (the "bundle playwright …" line), and
      # the live tests print the playwright client and the launched browser
      # versions on their "[chromium-pin]" lines. tests/fixtures/chromium-pin.mjs
      # reads that lock, and under CROW_REQUIRE_TEST_CHROME=1 a major mismatch
      # FAILS instead of warning (a profile from another major is not one a Crow
      # install can open).
      # Slow-mirror days (2026-10-26: ffmpeg alone hung 20 min) made setup eat
      # the whole limit. Reuse the .deb files and the browser from earlier
      # runs so installs rarely touch the mirror, retry apt, and cap each
      # install step so a hung mirror fails fast with a clear message.
      # restore + an explicit save (if: always()) instead of actions/cache,
      # so a cache is still saved when a later step fails or the job is slow.
      - name: Restore apt packages and the headless Chrome download
        id: ci-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/apt-debs
            ~/.cache/ms-playwright
          key: ci-setup-${{ runner.os }}-pw-${{ hashFiles('bundles/browser/package-lock.json') }}-${{ github.run_id }}
          # The lock-keyed entry first, then any earlier one: a lock bump must
          # still restore the .deb files (and playwright install prunes the
          # browsers the new version no longer references).
          restore-keys: |
            ci-setup-${{ runner.os }}-pw-${{ hashFiles('bundles/browser/package-lock.json') }}-
            ci-setup-${{ runner.os }}-pw-
      - name: Point apt at the restored packages (retries, keep downloads)
        run: |
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' 'APT::Keep-Downloaded-Packages "true";' 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/80-crow-ci >/dev/null
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          if ls ~/apt-debs/*.deb >/dev/null 2>&1; then sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/ && echo "restored $(ls ~/apt-debs/*.deb | wc -l) cached packages"; fi
      # The browser bundle's locked playwright-core, for the live browser tests
      # (tests/browser-close-leak-live.test.js resolves it from
      # bundles/browser/node_modules) AND the CLI that provisions the browser in
      # the next step. --ignore-scripts means no browser download here.
      - name: Browser bundle deps (locked playwright, for the live tests)
        run: npm ci --prefix bundles/browser --omit=optional --ignore-scripts --no-audit --no-fund
      # The bundle's OWN playwright installs the browser, so the live tests and a
      # real Crow install drive the same Chromium. A cached browser is skipped by
      # playwright itself; --with-deps still installs/refreshes the system libs.
      - name: Headless Chrome for the live layout tests
        timeout-minutes: 12
        run: |
          node -e 'const p=require("./bundles/browser/node_modules/playwright-core/package.json");const b=require("./bundles/browser/node_modules/playwright-core/browsers.json").browsers.filter((x)=>/^chromium/.test(x.name));console.log("bundle playwright "+p.version+": "+b.map((x)=>x.name+" "+x.browserVersion+" (revision "+x.revision+")").join(", "));'
          bundles/browser/node_modules/.bin/playwright install --with-deps chromium chromium-headless-shell
      # The job image sets CROW_TEST_FULL_CHROME=/opt/google/chrome/chrome (a
      # Google Chrome stable kept in the image for other uses), and
      # findHeadfulChrome() in tests/browser-close-leak-live.test.js returns that
      # variable FIRST — so without this step the headful live test would drive
      # the image's Chrome instead of the Chromium the browser bundle's locked
      # playwright ships (and the pin check would rightly fail it). Resolve the
      # bundle's own FULL Chromium from the revision its browsers.json pins and
      # override the variable for every later step. A missing binary FAILS this
      # step: the suite must never quietly fall back to the image's Chrome.
      - name: Point the live browser tests at the bundle's Chromium
        run: |
          BIN="$(node --input-type=module -e '
            import { existsSync } from "node:fs";
            import { homedir } from "node:os";
            import { join } from "node:path";
            import { bundleChromium } from "./tests/fixtures/chromium-pin.mjs";
            const pinned = bundleChromium();
            if (!pinned) {
              console.error("::error::the browser bundle has no playwright-core browsers.json to pin a Chromium revision against (run npm ci --prefix bundles/browser first)");
              process.exit(1);
            }
            const base = process.env.PLAYWRIGHT_BROWSERS_PATH || join(homedir(), ".cache", "ms-playwright");
            for (const sub of ["chrome-linux64", "chrome-linux"]) {
              const bin = join(base, `chromium-${pinned.revision}`, sub, "chrome");
              if (existsSync(bin)) { console.log(bin); process.exit(0); }
            }
            console.error(`::error::the browser bundle Chromium ${pinned.version} (revision ${pinned.revision}) is not installed under ${base}: expected chromium-${pinned.revision}/chrome-linux64/chrome or chromium-${pinned.revision}/chrome-linux/chrome`);
            process.exit(1);
          ')"
          CHROMIUM_DIR="$(dirname "$(dirname "$BIN")")"
          REVISION="${CHROMIUM_DIR##*/chromium-}"
          echo "CROW_TEST_FULL_CHROME=$BIN" >> "$GITHUB_ENV"
          echo "live browser tests run the browser bundle's Chromium revision $REVISION: $BIN"
      # The SunVox engine tests (tests/sunvox-studio.test.js) load the bundle's
      # vendored native library through koffi, which lives in the bundle's own
      # node_modules. Install it with exactly the flags the Extensions page
      # installer uses, so CI also proves that install path loads the engine.
      # The engine needs libasound (sunvox.so links it) and the mp3/ogg cases
      # need ffmpeg: installed explicitly, not left to whatever the image or an
      # earlier step happens to carry.
      - name: SunVox Studio bundle deps (engine tests)
        timeout-minutes: 12
        # The playwright step above already refreshed the apt lists in this job,
        # so try the install first and only re-run apt-get update if it fails.
        run: |
          sudo apt-get install -y -qq ffmpeg libasound2t64 || sudo apt-get install -y -qq ffmpeg libasound2 || { sudo apt-get update -qq && { sudo apt-get install -y -qq ffmpeg libasound2t64 || sudo apt-get install -y -qq ffmpeg libasound2; }; }
          npm ci --prefix bundles/sunvox-studio --omit=optional --ignore-scripts --no-audit --no-fund
          npm ci --prefix bundles/studio --omit=optional --ignore-scripts --no-audit --no-fund
      - name: Collect the downloaded apt packages for the cache
        if: always()
        run: mkdir -p ~/apt-debs && cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null; echo "$(ls ~/apt-debs/*.deb 2>/dev/null | wc -l) packages to cache"
      - name: Save apt packages and the headless Chrome download
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/apt-debs
            ~/.cache/ms-playwright
          key: ci-setup-${{ runner.os }}-pw-${{ hashFiles('bundles/browser/package-lock.json') }}-${{ github.run_id }}
      # GITHUB_ACTIONS=true applies tests/ci-exclusions.json (empty today);
      # host-bound tests self-skip via in-file capability guards instead.
      # CROW_REQUIRE_TEST_CHROME: a browser that fails to start fails the live
      # tests instead of letting them skip silently.
      # CROW_REQUIRE_SUNVOX_ENGINE: the SunVox engine tests fail instead of
      # skipping when the engine cannot load.
      - run: npm test
        env:
          CROW_REQUIRE_TEST_CHROME: "1"
          CROW_REQUIRE_SUNVOX_ENGINE: "1"

  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # build-registry imports ajv (a devDependency) via lib/bundle-contract —
      # a full npm ci is required (check-port-allocation alone is dep-free).
      - run: npm ci
      - name: Port allocation check
        run: node scripts/check-port-allocation.js
      - name: Registry build check
        run: node scripts/build-registry.mjs --check
      # Studio's vendored scripts (the SoundFont synth today, the NAM glue in PR
      # C) are checked in and rebuilt by esbuild. --check rebuilds to memory and
      # byte-compares, so a dependency bump nobody re-vendored fails here.
      - name: Studio vendor bundle check
        run: node bundles/studio/tools/build-vendor.mjs --check
      # Studio's Faust effects are compiled to WebAssembly and licence-linted by
      # tools/build-faust.mjs. --check recompiles to memory and byte-compares, so
      # a Faust library or a .dsp that changed without a rebuild fails here — and
      # the lint itself refuses any function whose licence Crow may not ship (the
      # GPL-only `co.*` functions and the AGPL-only `ba.processArray` included).
      - name: Studio Faust effects check (compile + licence lint)
        run: node bundles/studio/tools/build-faust.mjs --check
      # Every shipped bundle skill's current text must be in the ledger the
      # boot-time skill sync reads (bundles/skill-history.json), and the
      # ledger must stay append-only against the base (the PR's base commit,
      # or the push's previous commit — one shallow fetch of that single
      # commit). Fix with: node scripts/build-skill-history.mjs, then commit
      # the ledger. With no base (a first push), only coverage is checked.
      - name: Skill history check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            node scripts/build-skill-history.mjs --check --base "$BASE_SHA"
          else
            echo "no base commit: append-only check skipped"
            node scripts/build-skill-history.mjs --check
          fi
      # Vendored upstream payloads (bundles/<id>/payload/) must match the
      # payload_sha256 their vendor script stamped. Manifests without that
      # field are skipped by design — that is the pre-vendor draft state.
      - name: Vendored payload digest check
        run: node scripts/check-vendored-payloads.mjs
      # Design kit (bundles/design-kit/lib): every pinned file's sha256, every
      # licence file, exact version pins, no CSS that fetches at runtime, and no
      # remote URL in the kit's code or skills. Fix by re-vendoring:
      # node scripts/design-kit/vendor-lib.mjs
      - name: Design kit library check
        run: node scripts/check-design-kit-lib.mjs
      - run: npm run validate-model-catalog
      # This repo is public: no process documents (specs/plans/handoffs),
      # credentials, or real tailnet hostnames in tracked files. The local
      # personal-token denylist part is skipped here (CI is set).
      - name: Public hygiene check
        run: node scripts/check-public-hygiene.mjs

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Blocking tier: CRITICAL advisories in production deps stop merges.
      # Advisory-red playbook: fix same-day via upgrade or package.json
      # "overrides"; if genuinely unfixable same-day, raise the level in a PR
      # that links a tracking issue. Registry flakes are retried; note npm ci
      # in the suite job shares the same registry dependency anyway.
      - name: npm audit (blocking, critical, production deps)
        # npm exits 1 for vulns AND for many infra errors, so retry every
        # failure: a genuine critical just burns ~60s of retries before the
        # job goes red; a registry blip gets three chances.
        run: |
          for i in 1 2 3; do
            npm audit --omit=dev --audit-level=critical && exit 0
            echo "npm audit failed, retry $i/3"; sleep $((i*10))
          done
          exit 1
      # The vaultwarden bundle carries the Bitwarden CLI, which handles vault credentials
      # (Crow keychain): its own lock file gets the same blocking critical-tier audit.
      - name: npm audit (blocking, critical, vaultwarden bundle production deps)
        run: |
          for i in 1 2 3; do
            npm audit --prefix bundles/vaultwarden --omit=dev --audit-level=critical && exit 0
            echo "npm audit failed, retry $i/3"; sleep $((i*10))
          done
          exit 1
      # The workspace bundle parses untrusted office files (fflate, xmldom, ical.js): its own lock file
      # gets the same blocking critical-tier audit as vaultwarden.
      - name: npm audit (blocking, critical, workspace bundle production deps)
        run: |
          for i in 1 2 3; do
            npm audit --prefix bundles/workspace --omit=dev --audit-level=critical && exit 0
            echo "npm audit failed, retry $i/3"; sleep $((i*10))
          done
          exit 1
      # The design kit renderer parses specs that can come from outside the
      # owner's Crow (vega, mermaid, svgo, puppeteer-core): its own lock file gets
      # the same blocking critical-tier audit.
      - name: npm audit (blocking, critical, design-kit renderer production deps)
        run: |
          for i in 1 2 3; do
            npm audit --prefix bundles/design-kit/renderer --omit=dev --audit-level=critical && exit 0
            echo "npm audit failed, retry $i/3"; sleep $((i*10))
          done
          exit 1
      - name: npm audit (informational, full)
        continue-on-error: true
        run: npm audit || true

  phone-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv run --extra dev pytest -q
        working-directory: bundles/phone/runner

  coinbase-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv run --frozen --extra dev pytest -q
        working-directory: bundles/coinbase/engine
